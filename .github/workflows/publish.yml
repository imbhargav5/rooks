name: Publish to NPM

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: "patch: bump rooks by a patch version, commit to main, then publish. current: publish the version already on main."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - current
      summary:
        description: "Changelog entry for the patch release (patch only)"
        required: false
        default: "Patch release"
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  publish:
    name: Publish To NPM
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'imbhargav5/rooks' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Version Packages')) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ CI Setup
        uses: ./.github/actions/ci-setup

      - name: 📦 Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm (>=11.5.1 for OIDC)
        run: npm install -g npm@latest

      - name: 🔢 Bump patch version and commit to main
        id: bump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'patch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          if [[ -f .changeset/pre.json ]]; then
            echo "::error::Changesets pre-release mode is active (.changeset/pre.json). Exit pre mode before cutting a patch release."
            exit 1
          fi

          if [[ -z "${SUMMARY//[[:space:]]/}" ]]; then
            SUMMARY="Patch release"
          fi

          {
            echo '---'
            echo '"rooks": patch'
            echo '---'
            echo
            printf '%s\n' "$SUMMARY"
          } > ".changeset/manual-patch-${GITHUB_RUN_ID}.md"

          previous_version=$(node -p "require('./packages/rooks/package.json').version")
          pnpm run version
          next_version=$(node -p "require('./packages/rooks/package.json').version")

          IFS=. read -r prev_major prev_minor _ <<< "$previous_version"
          IFS=. read -r next_major next_minor _ <<< "$next_version"
          if [[ "$prev_major" != "$next_major" || "$prev_minor" != "$next_minor" ]]; then
            echo "::error::Pending changesets on main bump rooks from $previous_version to $next_version, which is not a patch release. Merge the Version Packages PR instead."
            exit 1
          fi

          echo "Bumping rooks $previous_version -> $next_version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Packages (patch v${next_version})"
          git push origin HEAD:main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🏗 Run build script
        run: pnpm turbo prepare-publish

      - name: Resolve package metadata
        id: package
        run: |
          package_name=$(node -p "require('./packages/rooks/package.json').name")
          package_version=$(node -p "require('./packages/rooks/package.json').version")
          {
            echo "name=$package_name"
            echo "version=$package_version"
            echo "tag=$package_name@$package_version"

            if [[ "$package_version" == *-* ]]; then
              echo "is_prerelease=true"
            else
              echo "is_prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm; skipping publish."
            exit 0
          fi

          npm stage publish --access public
        working-directory: packages/rooks

      - name: 🏷 Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIR: packages/rooks
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TAG_NAME: ${{ steps.package.outputs.tag }}
          TARGET_SHA: ${{ steps.bump.outputs.sha || github.sha }}
          IS_PRERELEASE: ${{ steps.package.outputs.is_prerelease }}
        run: |
          release_notes_file="$(mktemp)"

          awk -v version="$PACKAGE_VERSION" '
            $0 == "## " version { printing=1; next }
            printing && /^## / { exit }
            printing && !started && $0 == "" { next }
            printing { started=1; print }
          ' "$PACKAGE_DIR/CHANGELOG.md" > "$release_notes_file"

          if ! grep -q '[^[:space:]]' "$release_notes_file"; then
            printf 'Published %s to npm.\n' "$TAG_NAME" > "$release_notes_file"
          fi

          release_args=(--title "$TAG_NAME" --notes-file "$release_notes_file")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${release_args[@]}"
          else
            gh release create "$TAG_NAME" --target "$TARGET_SHA" "${release_args[@]}"
          fi
